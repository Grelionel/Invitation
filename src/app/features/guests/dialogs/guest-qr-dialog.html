<app-modal
  title="Code QR de l'invité"
  icon="fa-qrcode"
  iconColor="var(--success)"
  (closed)="closed.emit()"
>
  <div class="qr-display">
    <div
      style="
        margin-bottom: 15px;
        padding: 12px;
        background: var(--bg-light);
        border-radius: 8px;
        border: 2px solid var(--border);
      "
    >
      <label class="form-label" for="qrServerUrl">
        <i class="fas fa-server"></i> URL du serveur :
      </label>
      <input
        class="form-input"
        id="qrServerUrl"
        [(ngModel)]="urlDraft"
        style="font-family: monospace"
      />
      <button
        type="button"
        class="btn btn-primary"
        (click)="applyServerUrl()"
        style="width: 100%; margin-top: 8px"
      >
        <i class="fas fa-sync-alt"></i> Mettre à jour l'URL
      </button>
      <p style="margin-top: 8px; font-size: 0.75rem; color: var(--text-light)">
        <i class="fas fa-info-circle"></i> Copiez l'IP affichée dans le terminal (ex:
        http://192.168.1.64:3000)
      </p>
    </div>

    <app-qr-code [value]="scanUrl()" />

    <div class="qr-info">
      <div class="qr-info-item">
        <span class="qr-info-label">Statut</span>
        <span class="qr-info-value">{{ guest().status }}</span>
      </div>
      <div class="qr-info-item">
        <span class="qr-info-label">{{
          guest().status === 'Couple' ? 'Nom' : 'Nom et Prénom'
        }}</span>
        <span class="qr-info-value">{{ name() }}</span>
      </div>
      <div class="qr-info-item">
        <span class="qr-info-label">Table</span>
        <span class="qr-info-value">{{ guest().table }}</span>
      </div>
      <div class="qr-info-item">
        <span class="qr-info-label">URL QR</span>
        <span
          class="qr-info-value"
          style="font-size: 0.7rem; word-break: break-all; color: var(--accent)"
        >
          {{ scanUrl() }}
        </span>
      </div>
    </div>

    <div class="qr-actions">
      <button type="button" class="btn btn-success" (click)="download()">
        <i class="fas fa-download"></i> Télécharger
      </button>
      @if (guest().phone) {
        <button type="button" class="btn btn-whatsapp" (click)="sendWhatsApp()">
          <i class="fab fa-whatsapp"></i> Envoyer WhatsApp
        </button>
      }
    </div>
  </div>

  <ng-container modalFooter>
    <button type="button" class="btn-cancel" (click)="closed.emit()">Fermer</button>
  </ng-container>
</app-modal>
