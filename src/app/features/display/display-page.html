@if (welcomed(); as guest) {
  <div class="boarding-card welcoming">
    <div class="left-section">
      <div class="top-bar">
        <h1>Matthieu 6:10 « Que ton règne vienne, que ta volonté soit faite [...] »</h1>
      </div>
      <div class="logo-top">
        <div class="plane-icon"></div>
        <span>AIR MOUKABOU</span>
      </div>
      <div class="deco-plane deco-plane-1">✈</div>
      <div class="deco-plane deco-plane-2">✈</div>
      <div class="deco-heart deco-heart-1">♥</div>
      <div class="deco-heart deco-heart-2">♥</div>
      <div class="deco-heart deco-heart-4">♥</div>
      <div class="dotted-path"></div>

      <div class="content-welcome">
        <div class="guest-info">
          <div class="welcome-bienvenu">Bienvenue</div>
          <div class="show-guest-status">{{ guest.status }}</div>
          <div class="show-guest-name">{{ name() }}</div>
          <div class="show-guest-table">
            <span class="show-guest-table-label mt-3 mb-3">Table</span>
            <span class="show-guest-table-value mt-3 mb-3">{{ guest.table }}</span>
          </div>
          <div class="show-guest-icon"><i class="fas" [class]="icon()"></i></div>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="billet-image">
    <img src="assets/img/billet.jpeg" alt="" />
  </div>
}
